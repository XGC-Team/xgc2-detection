name: ci

on:
  push:
    branches:
      - noetic
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  package-compliance:
    name: Package compliance
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package metadata and packaging consistency
        run: |
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

  deb-build:
    name: Build ${{ matrix.package-group }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - package-group: onboard-detector-lv
            arch: amd64
            runner: ubuntu-latest
          - package-group: onboard-detector-lv
            arch: arm64
            runner: ubuntu-24.04-arm
          - package-group: fapp
            arch: amd64
            runner: ubuntu-latest
          - package-group: fapp
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Build deb packages in Docker
        env:
          DETECTION_PACKAGE_GROUP: ${{ matrix.package-group }}
          DETECTION_ARCH: ${{ matrix.arch }}
        run: |
          .xgc2/scripts/build_debs_in_docker.sh \
            --package-group "$DETECTION_PACKAGE_GROUP" \
            --work-dir "$RUNNER_TEMP/detection-${DETECTION_PACKAGE_GROUP}-${DETECTION_ARCH}" \
            --output-dir "$GITHUB_WORKSPACE/debs" \
            --skip-install-check

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-detection-debs-${{ matrix.package-group }}-${{ matrix.arch }}
          path: debs/*.deb

  meta-build:
    name: Build detection meta packages
    runs-on: ubuntu-latest
    needs: deb-build
    steps:
      - uses: actions/checkout@v4

      - name: Install meta package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot

      - name: Build meta deb packages
        env:
          DETECTION_META_ARCHES: amd64 arm64
        run: |
          mkdir -p debs
          for arch in $DETECTION_META_ARCHES; do
            .xgc2/scripts/package_debs.sh \
              --package-group meta \
              --arch "$arch" \
              --output-dir debs
          done

      - name: Upload meta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-detection-debs-meta
          path: debs/*.deb
